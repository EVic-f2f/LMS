<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | VIC systems</title>
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/Code/Modules/vicThemeModule.js"></script>
</head>
<body class="lms-app account-standalone">
  <header class="topbar">
    <div class="topbar-brand">YOUR ACCOUNT</div>
  </header>
  <nav class="sidebar" aria-label="Account navigation">
    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="/Storage/Image_assets/logo.jpg" alt="VIC systems"></div>
    </div>
    <a class="tablinks" href="main.html" aria-label="School workspace" title="School workspace"><span class="monitor-nav-icon icon-mask icon-school" aria-hidden="true"></span><span class="btn-text">School workspace</span></a>
    <a class="tablinks active" href="account.html" aria-label="Account" title="Account"><span class="monitor-nav-icon icon-mask icon-account" aria-hidden="true"></span><span class="btn-text">Account</span></a>
    <a class="tablinks bottom-tab" href="vic-home.html" aria-label="VIC Home" title="VIC Home"><span class="monitor-nav-icon icon-mask icon-home" aria-hidden="true"></span><span class="btn-text">VIC Home</span></a>
  </nav>
  <main class="main">
    <div class="page-heading">
      <div><div class="page-eyebrow">VIC SYSTEMS / PROFILE</div><h1>Account</h1></div>
    </div>
    <div id="account-content" class="account-page"></div>
  </main>
  <script src="/Code/Modules/introVideoModule.js"></script>
  <script src="/Code/Modules/storageModule.js"></script>
  <script src="/Code/Modules/authModule.js"></script>
  <script src="/Code/Modules/accountModule.js"></script>
  <script>
    const sidebar = document.querySelector('.sidebar');
    sidebar.addEventListener('mouseenter', () => document.body.classList.add('sidebar-expanded'));
    sidebar.addEventListener('mouseleave', () => document.body.classList.remove('sidebar-expanded'));
    Account.render();
  </script>
</body>
</html>
